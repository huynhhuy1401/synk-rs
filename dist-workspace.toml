[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Where the installers put synk (one-line install, no Rust needed)
install-path = "CARGO_HOME"
# No self-updater: install a new version the same way
install-updater = false
# Target platforms to build apps for (Rust target-triple syntax). No Intel
# Macs: PyTorch publishes no builds for them, so synk couldn't train there.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Releases run only on version tags, never on pull requests.
pr-run-mode = "skip"
