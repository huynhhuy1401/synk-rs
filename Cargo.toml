[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/huynhhuy1401/synk-rs"

[workspace.dependencies]
synk-core = { path = "crates/synk-core", version = "0.1.0" }
synk-store = { path = "crates/synk-store", version = "0.1.0" }
synk-connectors = { path = "crates/synk-connectors", version = "0.1.0" }
synk-pipeline = { path = "crates/synk-pipeline", version = "0.1.0" }

blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6"
dunce = "1"
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "3", features = ["json"] }
whatlang = "0.18"
unicode-normalization = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
